[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-ready"
version = "0.1.0"
description = "Score a repository on the things contributors and users look for, and tell you what to fix first."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "rodny90" }]
keywords = ["open-source", "maintainer", "linter", "repository", "checklist", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/rodny90/repo-ready"
Issues = "https://github.com/rodny90/repo-ready/issues"
Changelog = "https://github.com/rodny90/repo-ready/blob/main/CHANGELOG.md"

[project.scripts]
repo-ready = "repo_ready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
